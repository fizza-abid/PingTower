name: CI

on:
  push:
    branches: [main, arena/01a0c928-pingtower]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      MONGO_URI: mongodb://127.0.0.1:27017/pingtower-ci
      CRON_SECRET: ci-test-secret-0123456789-0123456789-0123456789
      ENABLE_LOCAL_CRON: "false"
      ALLOW_PRIVATE_TARGETS: "true"
      FAIL_THRESHOLD: "2"
      MAIL_ENABLED: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run server unit and mail tests
        run: npm test

      - name: Run Mongo integration tests
        run: RUN_INTEGRATION=1 npm run test:integration --workspace server

      - name: Lint client
        run: npm run lint

      - name: Build client
        run: npm run build
